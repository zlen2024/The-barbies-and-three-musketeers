<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | InventoryAI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 bg-white dark:bg-background-dark px-6 md:px-10 py-4 w-full">
<div class="flex items-center gap-3 text-primary">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined">inventory_2</span>
</div>
<h2 class="text-background-dark dark:text-white text-xl font-bold leading-tight tracking-tight">InventoryAI</h2>
</div>
<div class="hidden md:flex items-center gap-4">
<span class="text-sm text-slate-500">Need help?</span>
<a class="text-sm font-semibold text-primary hover:underline" href="#">Contact Support</a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-[480px] bg-white dark:bg-slate-900 rounded-xl shadow-2xl shadow-primary/5 border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Welcome Header -->
<div class="p-8 pb-4">
<h1 class="text-background-dark dark:text-white text-3xl font-black leading-tight tracking-tight mb-2">Welcome back</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal">Sign in to manage your global operations.</p>
</div>
<!-- Role Selector -->
<div class="px-8 py-4">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 text-sm font-semibold leading-normal">
<span class="truncate flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">trending_up</span>
                            Sales Portal
                        </span>
<input checked="" class="invisible w-0" name="portal-type" type="radio" value="sales"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 text-sm font-semibold leading-normal">
<span class="truncate flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">local_shipping</span>
                            Procurement Portal
                        </span>
<input class="invisible w-0" name="portal-type" type="radio" value="procurement"/>
</label>
</div>
</div>
<!-- Login Form -->
<form class="px-8 pt-4 pb-8 space-y-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-background-dark dark:text-slate-300 text-sm font-semibold leading-normal">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="form-input flex w-full rounded-xl text-background-dark dark:text-white focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 pl-12 pr-4 placeholder:text-slate-400 text-base font-normal transition-colors" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-background-dark dark:text-slate-300 text-sm font-semibold leading-normal">Password</label>
<a class="text-primary text-xs font-bold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400">lock</span>
<input class="form-input flex w-full rounded-xl text-background-dark dark:text-white focus:ring-2 focus:ring-primary/20 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 pl-12 pr-12 placeholder:text-slate-400 text-base font-normal transition-colors" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary transition-all cursor-pointer" id="remember" type="checkbox"/>
<label class="text-sm text-slate-500 dark:text-slate-400 cursor-pointer select-none" for="remember">Keep me signed in</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold text-base py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-4 active:scale-[0.98]" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Bottom Action -->
<div class="bg-slate-50 dark:bg-slate-800/50 p-6 text-center border-t border-slate-100 dark:border-slate-800">
<p class="text-sm text-slate-500 dark:text-slate-400">
                    Don't have an account?
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Request Access</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 px-6 text-center mt-auto">
<div class="flex justify-center gap-6 mb-4">
<a class="text-xs text-slate-400 hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-xs text-slate-400 hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-xs text-slate-400 hover:text-primary transition-colors" href="#">Security</a>
</div>
<p class="text-xs text-slate-400">© 2024 InventoryAI Systems Inc. All rights reserved.</p>
</footer>
<!-- Background Decoration -->
<div class="fixed top-0 right-0 -z-10 opacity-10 pointer-events-none">
<div class="w-[600px] h-[600px] bg-primary blur-[120px] rounded-full -mr-40 -mt-40"></div>
</div>
<div class="fixed bottom-0 left-0 -z-10 opacity-10 pointer-events-none">
<div class="w-[400px] h-[400px] bg-primary blur-[100px] rounded-full -ml-20 -mb-20"></div>
</div>
</body></html>
